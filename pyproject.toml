[project]
name = "notify-hub"
version = "0.1.0"
description = "Multi-channel notification hub — ingests from RSS/API/Webhook, filters, and delivers to Telegram/Slack/Discord/Email."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "TBD" }
authors = [
    { name = "AmirMohammad Ghasemzadeh", email = "AmirGh.DevTech@gmail.com" },
]
keywords = [
    "fastapi",
    "celery",
    "notifications",
    "webhooks",
    "rss",
    "telegram",
    "slack",
    "discord",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

# ─────────────────────────────────────────────
# Runtime dependencies
# ─────────────────────────────────────────────
dependencies = [
    # --- Web / API ---
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "python-multipart>=0.0.12",      # form/file uploads
    "httpx>=0.27,<0.28",             # async HTTP client

    # --- Config / Validation ---
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "email-validator>=2.2,<3.0",

    # --- DB ---
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "greenlet>=3.1,<4.0",               # needed by SQLAlchemy async

    # --- Task queue ---
    "celery[redis]>=5.4,<6.0",
    "redis>=5.2,<6.0",

    # --- Ingestors ---
    "feedparser>=6.0,<7.0",      # RSS/Atom
    "beautifulsoup4>=4.12,<5.0", # HTML cleaning
    "lxml>=5.3,<6.0",

    # --- Notifiers ---
    "python-telegram-bot>=21.9,<22.0",
    "slack-sdk>=3.34,<4.0",
    "discord-webhook>=1.3,<2.0",
    "aiosmtplib>=3.0,<4.0",

    # --- Reliability ---
    "tenacity>=9.0,<10.0", # retry with backoff
    "limits>=3.13,<4.0",   # rate limiting primitives

    # --- Observability ---
    "structlog>=24.4,<25.0",
    "prometheus-client>=0.21,<0.22",

    # --- Utils ---
    "python-dateutil>=2.9,<3.0",
    "orjson>=3.10,<4.0",
    "typing-extensions>=4.12,<5.0",
]

# ─────────────────────────────────────────────
# Dev dependencies (group: dev)
# ─────────────────────────────────────────────
[dependency-groups]
dev = [
    # Testing
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "httpx>=0.27,<0.28",                        # for TestClient
    "faker>=30.0,<31.0",
    "freezegun>=1.5,<2.0",
    "testcontainers[postgres,redis]>=4.8,<5.0",

    # Lint / Format
    "ruff>=0.8,<0.9",

    # Type checking
    "mypy>=1.13,<2.0",
    "types-python-dateutil>=2.9",
    "types-requests>=2.32",

    # Pre-commit
    "pre-commit>=4.0,<5.0",

    # Dev tooling
    "ipython>=8.30,<9.0",
    "rich>=13.9,<14.0",
    "watchfiles>=1.0,<2.0", # uvicorn --reload
]

# ─────────────────────────────────────────────
# Build system
# ─────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notify_hub"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]

# ─────────────────────────────────────────────
# uv
# ─────────────────────────────────────────────
[tool.uv]
package = true
default-groups = ["dev"]

# ─────────────────────────────────────────────
# Ruff (lint + format)
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "S",     # flake8-bandit
    "T20",   # flake8-print (no print statements)
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
    "TID",   # flake8-tidy-imports
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "PL",    # pylint
]
ignore = [
    "PLR0913", # too many args
    "PLR2004", # magic value comparison
    "S101",    # assert (fine in tests, but we scope per-file below)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "ARG001", "ARG002", "PLR2004"]
"migrations/**/*.py" = ["E501", "I001", "N999"]
"scripts/**/*.py" = ["T201"]                                              # allow print in scripts

[tool.ruff.lint.isort]
known-first-party = ["notify_hub"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ─────────────────────────────────────────────
# Mypy
# ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

exclude = ["^migrations/versions/.*", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["celery.*", "feedparser.*", "discord_webhook.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ─────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=notify_hub",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: unit tests (fast, no external deps)",
    "integration: integration tests (need Postgres/Redis)",
    "e2e: end-to-end tests",
    "slow: slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
    "ignore::pytest.PytestConfigWarning",
]

[tool.coverage.run]
branch = true
source = ["src/notify_hub"]
omit = ["*/tests/*", "*/migrations/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
]
show_missing = true
skip_covered = false

# ─────────────────────────────────────────────
# Bandit (security) — optional, ruff covers most
# ─────────────────────────────────────────────
# [tool.bandit]
# exclude_dirs = ["tests", "migrations"]
